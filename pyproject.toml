[project]
name = "transformer-remastered"
version = "0.1.0"
description = "From-scratch encoder-decoder Transformer with modern blocks and hand-written backward passes (MLX/NumPy)"
readme = "README.md"
authors = [
    { name = "Gevorg Khondkaryan", email = "gevorg.khondkaryan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "mlx>=0.32.4",
    "nnkit",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tokenizers>=0.23.3",
]

[tool.uv.sources]
nnkit = { git = "https://github.com/Gevornairi/nnkit", tag = "v0.4.0" }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false
